<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Nisleida Morales Geoportfolio</title>
  <script>
    // Redirect all GitHub Pages 404s back to index.html preserving the path
    // https://github.com/rafgraph/spa-github-pages
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
    );
  </script>
</head>
<body></body>
</html>
